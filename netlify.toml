[build]
  command = "npm run build"
  publish = "dist"

# /api/* MUST be proxied (not redirected) to the real backend once it is
# deployed, so the browser only ever sees requests to this site's own
# origin. This is required, not optional: src/lib/api.ts always calls a
# relative `/api/...` path (see its own comment) and never a configurable
# base URL, and the session cookie is httpOnly/SameSite=Lax — both depend
# on the frontend and API appearing same-origin to the browser. A plain
# CORS-based cross-origin setup would need application code changes; this
# does not.
#
# status = 200 makes this a proxy (Netlify fetches from the destination and
# returns the response under the original URL) rather than a 3xx redirect,
# which is what makes it same-origin from the browser's point of view.
#
# DELIBERATELY DISABLED (commented out) rather than left pointing at a
# fake host: a real backend has not been deployed yet, and a `force = true`
# proxy rule whose destination can never resolve is not safe production
# config to ship. Uncomment this block and replace the `to` value with the
# real backend URL once it exists (never invent one here):
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://REPLACE_WITH_REAL_BACKEND_URL/:splat"
#   status = 200
#   force = true

# SPA fallback — any other path (e.g. a direct refresh on /trade, /wallet,
# /admin) serves index.html so BrowserRouter can take over client-side,
# instead of Netlify 404ing a path it has no static file for. Must come
# after the /api/* rule above (Netlify matches redirects in file order).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
