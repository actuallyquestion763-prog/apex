; Required by api-proxy.php (same directory) for every multipart/form-data
; upload proxied through it (KYC documents, support attachments, deposit
; proofs, CMS media, crypto-deposit QR codes) to work at all.
;
; Without this setting, PHP's default behavior (enable_post_data_reading=1)
; auto-parses a multipart/form-data request body into $_POST/$_FILES and
; leaves php://input EMPTY for that request. api-proxy.php reads the raw
; body via php://input and forwards it verbatim to the real backend — with
; this setting missing, it forwards an EMPTY body but the ORIGINAL
; Content-Type header (still declaring the real multipart boundary), so the
; backend's busboy parser sees a declared boundary with no body and fails
; with "Multipart: Unexpected end of form".
;
; NOTE: this file is version-controlled here for reference, but the
; GitHub Actions deploy workflow (.github/workflows/deploy-namecheap.yml)
; deliberately never uploads it — a git push does NOT deploy this. It must
; be uploaded manually to the same server directory as api-proxy.php (the
; Namecheap public_html root) via cPanel File Manager or FTP. PHP caches
; .user.ini for user_ini.cache_ttl seconds (300s / 5 minutes by default),
; so allow a few minutes after upload before it takes effect.
enable_post_data_reading=0
